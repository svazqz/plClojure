name: "Validation"
on:
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "main"
  workflow_dispatch: {}
permissions:
  contents: "read"
concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true
jobs:
  validate:
    name: "PostgreSQL handler build and JVM smoke test"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 22
    steps:
      - name: "Check out source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: "Build the PostgreSQL and JVM test image"
        run: "docker build -f tests/Dockerfile -t plclojure-tests ."
      - name: "Run PostgreSQL extension integration tests"
        run: "docker run --rm --network none plclojure-tests"
