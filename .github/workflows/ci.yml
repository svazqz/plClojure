name: "Validation"
on:
  pull_request: {}
  push:
    branches:
      - "main"
  workflow_dispatch: {}
permissions:
  contents: "read"
concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true
jobs:
  validate:
    name: "PostgreSQL handler build and JVM smoke test"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 12
    steps:
      - name: "Check out source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: "Set up Java"
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: "temurin"
          java-version: "17"
      - name: "Install PostgreSQL development headers"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-server-dev-16
      - name: "Compile the JNI handler"
        run: |
          test -f "$(pg_config --includedir-server)/postgres.h"
          cc -fPIC -shared -I"$(pg_config --includedir-server)" -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" src/pl_clojure_handler.c -L"$JAVA_HOME/lib/server" -ljvm -o "$RUNNER_TEMP/pl_clojure_handler.so"
          test -s "$RUNNER_TEMP/pl_clojure_handler.so"
          bash -n install.sh
          bash -n test.sh
      - name: "Check the bundled Clojure runtime"
        run: "java -cp 'lib/*' clojure.main -e '(assert (= 15 (reduce + [1 2 3 4 5])))'"
